services:
  - type: web
    name: atlas-rag-assistant
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CHROMA_DB_PATH
        value: /app/data/chroma_db
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-120b
      - key: COOKIE_HTTPS_ONLY
        value: "true"
    disk:
      name: atlas-data
      mountPath: /app/data
      sizeGB: 1
